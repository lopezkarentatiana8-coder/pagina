<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarePlus Medical</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3f4f7;--bg2:#d3ecf1;--card:rgba(255,255,255,.72);--ink:#0b1f26;--muted:#4b6670;--accent:#4aa8b5;--accent-ink:#fff;--line:rgba(255,255,255,.9);--shadow:0 8px 24px rgba(40,110,125,.14);--hero:linear-gradient(120deg,#f4fbfc 0%,#cfe9ee 60%,#a9d5de 100%);--icon:#6bb7c3;color-scheme:light;--pink:#f06fa4;--pink-soft:#ffe3ee;--pink-ink:#7a1f48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:90px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;padding:12px 0}
.nav{display:flex;align-items:center;gap:20px;padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;line-height:1.1;letter-spacing:.02em}
.links{display:flex;gap:22px;margin-left:auto;font-size:14px;font-weight:500}
.links a{padding:4px 2px;border-bottom:2px solid transparent}
.links a.on,.links a:hover{color:var(--accent);border-color:var(--accent)}
.btn{display:inline-block;border:0;cursor:pointer;font:600 14px Inter,sans-serif;color:var(--accent-ink);background:var(--accent);padding:10px 20px;border-radius:999px}
.btn:hover{filter:brightness(1.08)}
.burger{display:none;margin-left:auto;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px}
.hero{margin-top:8px;border-radius:32px;background:var(--hero);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative;padding:64px 40px 40px}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin:0 0 14px;font-weight:800;max-width:11ch;letter-spacing:-.02em}
.hero p.sub{font-size:18px;max-width:30ch;color:var(--muted);margin:0 0 40px}
.brain{position:absolute;right:40px;top:28px;width:min(34%,300px);aspect-ratio:1;border-radius:28px;overflow:hidden;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--muted);padding:12px}.brain img{width:100%;height:100%;object-fit:cover;margin:-12px}
.book{position:relative;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:14px;align-items:end;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px)}
.book label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.book select,.book input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:500 14px Inter,sans-serif}
.book option{color:#0b1f26}
.ok{margin:14px 0 0;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--accent);font-weight:600;position:relative}
section.s{padding:56px 0}
section.alt{background:var(--bg2)}
h2{text-align:center;font-size:26px;margin:0 0 32px;font-weight:700}
.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.dept{padding:32px 20px;text-align:center;font-weight:600;font-size:18px;cursor:pointer;transition:transform .2s}
.dept:hover{transform:translateY(-3px)}
.dept svg{display:block;margin:0 auto 14px}
.svc{padding:12px 12px 20px}
.svc .pic{height:170px;border-radius:16px;background:linear-gradient(135deg,#dff1f4,#b6dbe3);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.svc h3{margin:0 8px 6px;font-size:18px}
.svc p{margin:0 8px;color:var(--muted);font-size:14px}
footer{padding:40px 0 32px}
.creator{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.photo{width:120px;height:120px;border-radius:50%;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px dashed var(--accent);box-shadow:var(--shadow);color:var(--muted);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover}
.who{margin:0;color:var(--muted);font-size:14px}.who strong{color:var(--ink);font-size:18px}
.cal{max-width:440px;margin:0 auto;padding:22px;border-radius:28px;background:linear-gradient(160deg,#fff0f6,var(--pink-soft));border:1px solid #ffc8de;box-shadow:0 8px 24px rgba(240,111,164,.22);color:var(--pink-ink)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:700;text-transform:capitalize}
.cal-head button{border:0;background:#fff;color:var(--pink);width:34px;height:34px;border-radius:50%;cursor:pointer;font:700 18px Inter,sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-grid span{font-size:12px;font-weight:600;opacity:.7;padding:4px 0}
.cal-grid button{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:inherit;font:500 14px Inter,sans-serif;cursor:pointer}
.cal-grid button:hover:not(:disabled){background:#fff}
.cal-grid button:disabled{opacity:.35;cursor:default}
.cal-grid button.today{outline:2px solid var(--pink)}
.cal-grid button.sel{background:var(--pink);color:#fff}
.cal-note{text-align:center;margin:14px 0 0;font-size:13px}
@media (max-width:820px){
.links,.nav>.btn{display:none}.burger{display:block}
.nav.open{flex-wrap:wrap;border-radius:24px}.nav.open .links{display:flex;flex-direction:column;width:100%;gap:8px;order:3;margin:0}
.nav.open>.btn{display:inline-block;order:4;width:100%;text-align:center}
.hero{padding:40px 20px 24px}.brain{position:static;width:100%;max-width:240px;margin:0 0 20px}
.book{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dept{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState} = React;
const h = React.createElement;
const svg = (size, kids, vb) => h('svg', {width:size, height:size, viewBox:vb||'0 0 64 64', fill:'none', stroke:'currentColor', strokeWidth:3, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true, style:{color:'var(--icon)'}}, kids);

const Cross = () => svg(30, [h('path',{key:1,d:'M24 8h16v16h16v16H40v16H24V40H8V24h16z',fill:'var(--accent)',stroke:'none'})]);
const IcAmbulance = () => svg(76, [h('rect',{key:1,x:4,y:20,width:40,height:26,rx:5}),h('path',{key:2,d:'M44 28h8l8 8v10H44'}),h('circle',{key:3,cx:18,cy:48,r:5}),h('circle',{key:4,cx:50,cy:48,r:5}),h('path',{key:5,d:'M24 27v12M18 33h12'})]);
const IcBear = () => svg(76, [h('circle',{key:1,cx:32,cy:36,r:18}),h('circle',{key:2,cx:16,cy:16,r:7}),h('circle',{key:3,cx:48,cy:16,r:7}),h('circle',{key:4,cx:26,cy:33,r:1.5}),h('circle',{key:5,cx:38,cy:33,r:1.5}),h('ellipse',{key:6,cx:32,cy:42,rx:5,ry:4})]);
const IcHeart = () => svg(76, [h('path',{key:1,d:'M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z'}),h('path',{key:2,d:'M10 32h14l4-8 6 16 4-8h16'})]);
const IcScan = () => svg(96, [h('rect',{key:1,x:6,y:14,width:52,height:36,rx:8}),h('circle',{key:2,cx:32,cy:32,r:12}),h('path',{key:3,d:'M32 26v12M26 32h12'})]);
const IcSurg = () => svg(96, [h('path',{key:1,d:'M14 12h36l-6 14H20z'}),h('path',{key:2,d:'M32 26v14'}),h('rect',{key:3,x:8,y:44,width:48,height:8,rx:3})]);
const IcLab = () => svg(96, [h('path',{key:1,d:'M24 8h16M28 8v18L12 52a4 4 0 0 0 4 6h32a4 4 0 0 0 4-6L36 26V8'}),h('path',{key:2,d:'M20 42h24'})]);

const BRAIN_SRC = '';
const DEPTS = [
  {id:'urgencias', name:'Urgencias', icon:IcAmbulance, docs:['Dr. Martín Sosa','Dra. Laura Pérez']},
  {id:'pediatria', name:'Pediatría', icon:IcBear, docs:['Dra. Ana Gómez','Dr. Julián Ríos']},
  {id:'cardiologia', name:'Cardiología', icon:IcHeart, docs:['Dr. Pablo Herrera','Dra. Carla Núñez']}
];
const SERVICES = [
  {name:'Diagnóstico avanzado', icon:IcScan, text:'Tomografía, resonancia y ecografía con equipos de imagen de última generación.'},
  {name:'Cirugías especializadas', icon:IcSurg, text:'Quirófanos modernos con equipamiento completo y equipos médicos de alta experiencia.'},
  {name:'Laboratorio clínico', icon:IcLab, text:'Análisis con resultados rápidos y seguimiento online de cada estudio.'}
];

function Nav() {
  const [open, setOpen] = useState(false);
  const items = [['inicio','Inicio'],['servicios','Servicios'],['departamentos','Departamentos'],['doctores','Doctores'],['contacto','Contacto']];
  return h('header', null, h('div', {className:'wrap'},
    h('nav', {className:'nav'+(open?' open':''), 'aria-label':'Principal'},
      h('a', {className:'logo', href:'#inicio'}, h(Cross), h('span', null, 'CAREPLUS', h('br'), 'MEDICAL')),
      h('div', {className:'links'}, items.map(([id,l],i) => h('a', {key:id, href:'#'+id, className:i===0?'on':'', onClick:()=>setOpen(false)}, l))),
      h('a', {className:'btn', href:'#reservar', onClick:()=>setOpen(false)}, 'Reservar turno'),
      h('button', {className:'burger', 'aria-label':'Abrir menú', 'aria-expanded':open, onClick:()=>setOpen(!open)}, svg(26, [h('path',{key:1,d:'M8 18h48M8 32h48M8 46h48'})]))
    )));
}

function Booking({date, setDate}) {
  const [dep, setDep] = useState('');
  const [doc, setDoc] = useState('');
  const [msg, setMsg] = useState('');
  const docs = (DEPTS.find(d => d.id === dep) || {docs:[]}).docs;
  const submit = () => {
    if (!dep || !doc || !date) { setMsg('Completá departamento, doctor y fecha para reservar.'); return; }
    const d = DEPTS.find(x => x.id === dep).name;
    setMsg('Turno solicitado: ' + d + ' con ' + doc + ' el ' + date.split('-').reverse().join('/') + '. Te confirmaremos por correo.');
  };
  const today = new Date().toISOString().slice(0,10);
  return h('div', {id:'reservar'},
    h('div', {className:'book'},
      h('div', null, h('label', {htmlFor:'dep'}, 'Departamento'),
        h('select', {id:'dep', value:dep, onChange:e=>{setDep(e.target.value); setDoc(''); setMsg('');}},
          h('option', {value:''}, 'Elegí uno'), DEPTS.map(d => h('option', {key:d.id, value:d.id}, d.name)))),
      h('div', null, h('label', {htmlFor:'doc'}, 'Doctor'),
        h('select', {id:'doc', value:doc, disabled:!dep, onChange:e=>{setDoc(e.target.value); setMsg('');}},
          h('option', {value:''}, dep?'Elegí uno':'Primero el departamento'), docs.map(n => h('option', {key:n, value:n}, n)))),
      h('div', null, h('label', {htmlFor:'fecha'}, 'Fecha'),
        h('input', {id:'fecha', type:'date', min:today, value:date, onChange:e=>{setDate(e.target.value); setMsg('');}})),
      h('button', {className:'btn', style:{height:42}, onClick:submit}, 'Reservar ahora')),
    msg && h('p', {className:'ok', role:'status'}, msg));
}

function Hero({date, setDate}) {
  return h('div', {className:'wrap', id:'inicio'}, h('div', {className:'hero'},
    h('div', {className:'brain'}, BRAIN_SRC ? h('img', {src:BRAIN_SRC, alt:'Cerebro'}) : 'Acá va la imagen del cerebro'),
    h('h1', null, 'Tu salud, nuestra prioridad'),
    h('p', {className:'sub'}, 'Atención cálida para vos y tu familia'),
    h(Booking, {date, setDate})));
}

function Departments() {
  return h('section', {className:'s', id:'departamentos'}, h('div', {className:'wrap'},
    h('h2', null, 'Nuestros departamentos'),
    h('div', {className:'grid g3'}, DEPTS.map(d => h('a', {key:d.id, href:'#reservar', className:'card dept'}, h(d.icon), d.name)))));
}

function Services() {
  return h('section', {className:'s alt', id:'servicios'}, h('div', {className:'wrap'},
    h('h2', null, 'Servicios destacados'),
    h('div', {className:'grid g3'}, SERVICES.map(s => h('article', {key:s.name, className:'card svc'},
      h('div', {className:'pic'}, h(s.icon)), h('h3', null, s.name), h('p', null, s.text))))));
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function Calendar({date, setDate}) {
  const now = new Date();
  const [ym, setYm] = useState({y:now.getFullYear(), m:now.getMonth()});
  const pad = n => String(n).padStart(2,'0');
  const iso = d => ym.y + '-' + pad(ym.m+1) + '-' + pad(d);
  const todayIso = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  const offset = (new Date(ym.y, ym.m, 1).getDay() + 6) % 7;
  const total = new Date(ym.y, ym.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(d);
  const move = n => setYm(p => { const x = new Date(p.y, p.m + n, 1); return {y:x.getFullYear(), m:x.getMonth()}; });
  return h('section', {className:'s', id:'calendario'}, h('div', {className:'wrap'},
    h('h2', null, 'Calendario de turnos'),
    h('div', {className:'cal'},
      h('div', {className:'cal-head'},
        h('button', {'aria-label':'Mes anterior', onClick:()=>move(-1)}, '‹'),
        h('span', {'aria-live':'polite'}, MESES[ym.m] + ' ' + ym.y),
        h('button', {'aria-label':'Mes siguiente', onClick:()=>move(1)}, '›')),
      h('div', {className:'cal-grid'},
        ['L','M','M','J','V','S','D'].map((l,i) => h('span', {key:'w'+i}, l)),
        cells.map((d,i) => d === null ? h('i', {key:'e'+i}) :
          h('button', {key:d, disabled:iso(d) < todayIso, className:(iso(d)===todayIso?'today ':'')+(iso(d)===date?'sel':''), 'aria-pressed':iso(d)===date, onClick:()=>setDate(iso(d))}, d))),
      h('p', {className:'cal-note'}, date ? 'Fecha elegida: ' + date.split('-').reverse().join('/') : 'Elegí un día para tu turno.'))));
}

function Footer() {
  const [photo, setPhoto] = useState(() => { try { return localStorage.getItem('tl-photo') || ''; } catch (e) { return ''; } });
  const pick = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { setPhoto(r.result); try { localStorage.setItem('tl-photo', r.result); } catch (e) {} };
    r.readAsDataURL(f);
  };
  return h('footer', {id:'contacto'}, h('div', {className:'wrap creator'},
    h('label', {className:'photo', title:'Tocá para poner tu foto'},
      photo ? h('img', {src:photo, alt:'Tatiana Lopez'}) : h('span', null, 'Tu foto'),
      h('input', {type:'file', accept:'image/*', onChange:pick, hidden:true})),
    h('p', {className:'who'}, 'Creadora', h('br'), h('strong', null, 'Tatiana Lopez'))));
}

function App() {
  const [date, setDate] = useState('');
  return h(React.Fragment, null, h(Nav), h('main', null, h(Hero, {date, setDate}), h(Departments), h(Calendar, {date, setDate}), h(Services)), h(Footer));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
